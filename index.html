<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Juegos · CEIP Carlos III</title>
  <meta name="description" content="Los juegos del CEIP Carlos III. Sin anuncios, sin registro.">
  <meta name="theme-color" content="#F3EDE2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11100E" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="palabra/assets/icon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "Fraunces"; src: url("palabra/assets/fonts/fraunces-latin-full-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Fraunces"; src: url("palabra/assets/fonts/fraunces-latin-full-italic.woff2") format("woff2"); font-weight: 100 900; font-style: italic; font-display: swap; }
    @font-face { font-family: "Inter"; src: url("palabra/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }

    :root {
      --bg: #F3EDE2; --surface: #FBF8F2; --ink: #1C1A16; --ink-2: #4A453C; --muted: #7B7366; --line: #D8CEBC;
      --correct: #2F7A58; --present: #D69E1E; --absent: #8C8577; --accent: #C4492B;
      --shadow: 0 30px 70px -30px rgba(58, 44, 20, .35), 0 6px 18px -8px rgba(58, 44, 20, .15);
      --ease: cubic-bezier(.2, .8, .2, 1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11100E; --surface: #1B1A17; --ink: #F2ECE0; --ink-2: #CFC7B8; --muted: #8E8676; --line: #2C2A25;
        --correct: #3A9068; --present: #D2A02C; --absent: #36332E; --accent: #E0694A;
        --shadow: 0 30px 70px -30px rgba(0, 0, 0, .8), 0 6px 18px -8px rgba(0, 0, 0, .5);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      background: radial-gradient(90vmax 70vmax at 0% 0%, color-mix(in srgb, var(--present) 16%, transparent), transparent 60%),
                  radial-gradient(80vmax 60vmax at 100% 100%, color-mix(in srgb, var(--correct) 12%, transparent), transparent 60%),
                  var(--bg);
      color: var(--ink); font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
      padding: max(20px, env(safe-area-inset-top)) 16px 40px;
    }
    main { max-width: 880px; margin: 0 auto; }
    header { padding: 40px 0 36px; border-bottom: 1px solid var(--line); margin-bottom: 36px; animation: rise .9s var(--ease) both; }
    .eyebrow { margin: 0 0 14px; font-size: 11px; font-weight: 640; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    h1 {
      margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 520;
      font-size: clamp(44px, 11vw, 88px); line-height: .95; letter-spacing: -.04em;
      font-variation-settings: "opsz" 144, "SOFT" 40;
    }
    h1 em { font-style: italic; color: var(--ink-2); font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1; }
    h1 em::after { content: ""; display: inline-block; width: .15em; height: .15em; border-radius: 50%; background: var(--accent); margin-left: .05em; }
    .lead { margin: 18px 0 0; max-width: 34em; font-size: 16px; line-height: 1.55; color: var(--ink-2); }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .card {
      position: relative; display: flex; flex-direction: column; gap: 22px;
      padding: 26px; border-radius: 22px; min-height: 250px;
      background: var(--surface); color: inherit; text-decoration: none;
      box-shadow: var(--shadow), inset 0 0 0 1px color-mix(in srgb, var(--ink) 6%, transparent);
      transition: transform .5s var(--ease), box-shadow .5s var(--ease);
      animation: rise .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms + 150ms);
    }
    a.card:hover { transform: translateY(-4px); }
    a.card:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
    .tiles { display: flex; gap: 6px; }
    .tiles span {
      width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center;
      font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 22px; color: #FFFDF8;
      transition: transform .6s var(--ease); transition-delay: calc(var(--j) * 50ms);
    }
    a.card:hover .tiles span { transform: translateY(-4px) rotate(-3deg); }
    .c { background: var(--correct); } .p { background: var(--present); } .a { background: var(--absent); }
    .card h2 { margin: 0; font-family: "Fraunces", Georgia, serif; font-weight: 540; font-size: 30px; letter-spacing: -.03em; font-variation-settings: "opsz" 144; }
    .card p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.5; color: var(--ink-2); }
    .go { margin-top: auto; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 640; }
    .go i { font-style: normal; transition: transform .4s var(--ease); }
    a.card:hover .go i { transform: translateX(4px); }
    .soon { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); border: 0; justify-content: center; align-items: flex-start; }
    .soon .tiles span { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line); }
    .soon h2 { color: var(--muted); }
    footer { margin-top: 44px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.6; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">CEIP Carlos III</p>
      <h1>Juegos del <em>cole</em></h1>
      <p class="lead">Juegos para aprender en clase y en casa. Sin anuncios, sin registro y sin rastreadores.</p>
    </header>

    <div class="grid">
      <a class="card" href="palabra/" style="--i:0">
        <div class="tiles" aria-hidden="true"><span class="c" style="--j:0">P</span><span class="p" style="--j:1">A</span><span class="a" style="--j:2">L</span><span class="c" style="--j:3">A</span><span class="c" style="--j:4">B</span></div>
        <div>
          <h2>Palabra</h2>
          <p>Adivina la palabra del día en seis intentos. Modo libre y retos de clase.</p>
        </div>
        <span class="go">Jugar <i aria-hidden="true">→</i></span>
      </a>
      <div class="card soon" style="--i:1" aria-label="Próximamente">
        <div class="tiles" aria-hidden="true"><span></span><span></span><span></span></div>
        <div>
          <h2>Próximamente</h2>
          <p>Nuevos juegos en camino.</p>
        </div>
      </div>
    </div>

    <footer>Hecho en el CEIP Carlos III</footer>
  </main>
</body>
</html>
